<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Stack - Drag & Drop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Drag the Photos Around</h1>

        <div class="photo-stack" id="photoStack">
            <!-- Photos are dynamically loaded from js/drag.js -->
            <!-- To add more photos: -->
            <!-- 1. Add your image file to assets/images/ -->
            <!-- 2. Add the filename to IMAGE_FILES array in js/drag.js -->
            <!-- That's it! The photo will appear automatically. -->
        </div>
    </div>

    <script src="js/drag.js"></script>
</body>
</html>
