<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Stack - Drag & Drop</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Drag the Photos Around</h1>

        <div class="photo-stack" id="photoStack">
            <!-- Photos support any image format: JPG, PNG, GIF, SVG, WebP, etc. -->
            <!-- Simply replace the src with your own images! -->
            <div class="photo" data-photo="1">
                <img src="assets/images/photo1.jpg" alt="Photo 1">
            </div>
            <div class="photo" data-photo="2">
                <img src="assets/images/photo2.jpg" alt="Photo 2">
            </div>
            <div class="photo" data-photo="3">
                <img src="assets/images/photo3.jpg" alt="Photo 3">
            </div>
            <div class="photo" data-photo="4">
                <img src="assets/images/photo4.jpg" alt="Photo 4">
            </div>
            <div class="photo" data-photo="5">
                <img src="assets/images/photo5.jpg" alt="Photo 5">
            </div>
            <!-- Animated GIF/SVG examples - animations continue while dragging! -->
            <div class="photo" data-photo="6">
                <img src="assets/images/animated-demo.svg" alt="Animated Demo 1">
            </div>
            <div class="photo" data-photo="7">
                <img src="assets/images/animated-demo2.svg" alt="Animated Demo 2">
            </div>
        </div>
    </div>

    <script src="js/drag.js"></script>
</body>
</html>
