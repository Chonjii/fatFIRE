<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#10B981"/>

  <!-- Rotating square -->
  <rect x="150" y="100" width="100" height="100" fill="white" opacity="0.3">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 200 150"
      to="360 200 150"
      dur="4s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Bouncing circles -->
  <circle cx="100" cy="300" r="25" fill="white" opacity="0.5">
    <animate attributeName="cy" values="300;250;300" dur="1s" repeatCount="indefinite"/>
  </circle>

  <circle cx="200" cy="300" r="25" fill="white" opacity="0.5">
    <animate attributeName="cy" values="300;250;300" dur="1s" begin="0.2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="300" cy="300" r="25" fill="white" opacity="0.5">
    <animate attributeName="cy" values="300;250;300" dur="1s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated text -->
  <text x="50%" y="60%" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">
    Animated!
  </text>

  <!-- Pulsing ring -->
  <circle cx="200" cy="450" r="30" fill="none" stroke="white" stroke-width="3" opacity="0.6">
    <animate attributeName="r" values="30;50;30" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
