<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" fill="#EC4899"/>

  <!-- Animated background circles -->
  <circle cx="200" cy="150" r="40" fill="white" opacity="0.4">
    <animate attributeName="r" values="40;60;40" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="120" cy="350" r="30" fill="white" opacity="0.4">
    <animate attributeName="r" values="30;45;30" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="280" cy="350" r="30" fill="white" opacity="0.4">
    <animate attributeName="r" values="30;45;30" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated text -->
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="42" fill="white" text-anchor="middle" dominant-baseline="middle" font-weight="bold">
    GIF/SVG
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Animated rectangles -->
  <rect x="150" y="400" width="100" height="20" rx="10" fill="white" opacity="0.5">
    <animate attributeName="width" values="100;120;100" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x" values="150;140;150" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
